# Print server only. Put it behind an HTTPS reverse proxy for anything public;
# Microsoft Entra sign-in for /manage requires an https:// SITE_URL.
#
#   cp packages/server/.env.example print-server.env   # then fill it in
#   docker compose -f examples/compose.server.yml up -d
name: uwacwy-print-server

services:
  print-server:
    image: ghcr.io/uwacwy/print-server:${PRINT_VERSION:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./print-server.env
        required: false
    environment:
      # The image's data volume; overrides ./data from a copied .env.example.
      DATA_DIR: /data
      # Required, at least 32 characters: openssl rand -base64 48
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET:?set UPLOAD_TOKEN_SECRET}
      # For example https://print.contoso.com; branding (SITE_TITLE=Quick Print, SITE_ORG_NAME=Contoso,
      # SITE_LOGO_ALT, SITE_FOOTER_LINKS) goes in print-server.env.
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      # Extra host names the web app may be served under (comma-separated).
      # SITE_URL's host name is always allowed.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-}
      # Only "true" behind a reverse proxy that sets X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TIME_ZONE: ${TIME_ZONE:-America/Denver}
    ports:
      - '8080:8080'
    volumes:
      # print.db and queued jobs
      - print-data:/data
      # Optional header logo (logo.svg, logo.png, or logo.jpg), mounted read-only. Anything in
      # /data/public is served as a static file; `docker compose up -d --force-recreate` after
      # replacing a single mounted file.
      # - ./logo.svg:/data/public/logo.svg:ro

volumes:
  print-data:
