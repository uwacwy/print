# Redeploys the production print server (https://print.uwacwy.org) from ghcr.io.
#
# Called by release.yml after the images are pushed for a stable vX.Y.Z tag. Run manually to redeploy
# (the "production" environment only accepts v*.*.* tags):
#   gh workflow run deploy.yml --ref vX.Y.Z
#
# GitHub assumes an AWS role through OIDC; the role may only run one parameterless SSM document on one
# host. That document pulls the image tag pinned in the host's stack .env (PRINT_VERSION), restarts it,
# and rolls back if it is unhealthy. Infrastructure lives in omega-docker:
# clients/unitedwayalbanycounty/{infra/print.yml,scripts/print/}.
name: Deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: print-deploy-${{ github.run_id }}
      - name: Run deploy document on the host
        id: ssm
        env:
          DOCUMENT: ${{ vars.AWS_DEPLOY_DOCUMENT }}
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --document-name "$DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --comment "print ${GITHUB_REF_NAME} run ${GITHUB_RUN_ID}" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          output=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text)
          printf '%s\n' "$output"
          printf '%s\n' "$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)" >&2
          [[ "$status" == Success ]] || { echo "::error::Deploy finished with status $status"; exit 1; }
          sed -n 's/^deployed_version=/version=/p' <<<"$output" >> "$GITHUB_OUTPUT"
      - name: Check the public site
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOYED_VERSION: ${{ steps.ssm.outputs.version }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --max-time 15 "$DEPLOY_URL/api/healthz" | jq -e '.status == "ok"'
          echo "Running print-server $DEPLOYED_VERSION at $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$DEPLOYED_VERSION" != "$tag_version" ]]; then
            echo "::warning::Production runs $DEPLOYED_VERSION, not $tag_version. It tracks the PRINT_VERSION tag in its stack .env; bump it and run 05-deploy.sh to move to a new minor or major version."
          fi
