# Publishes @uwacwy/print-server and @uwacwy/print-agent to npm and their images to
# ghcr.io when a vX.Y.Z tag is pushed. Releases move the npm "latest" dist-tag.
# Prereleases (v0.2.0-rc.1, v0.2.0-beta.0) publish to a dist-tag named after the
# prerelease (rc, beta) and do not move the "latest" npm or image tags.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PUBLIC_URL: http://print.contoso.com
  UPLOAD_TOKEN_SECRET: build-time-placeholder-not-a-secret-0000

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check tag matches package versions
        run: npm run version:check -- "$GITHUB_REF_NAME"
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true"
            # npm dist-tag from the prerelease name: 1.2.0-rc.1 -> rc, 1.2.0-beta -> beta.
            # npm rejects tags that parse as semver ranges (1.2.0-0 -> "0"), so those use next.
            id="${version#*-}"
            id="${id%%.*}"
            if [[ "$id" =~ ^[A-Za-z][A-Za-z0-9-]*$ && "$id" != latest ]]; then
              echo "dist_tag=$id"
            else
              echo "dist_tag=next"
            fi
          else
            echo "prerelease=false"
            echo "dist_tag=latest"
          fi >> "$GITHUB_OUTPUT"
      - run: echo "npm dist-tag ${{ steps.version.outputs.dist_tag }}"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:typed
      - run: npm run extract-i18n -w @uwacwy/print-server
      - run: git diff --exit-code packages/server/src/locale/messages.xlf
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run -w @uwacwy/print-server -w @uwacwy/print-agent

  npm:
    needs: verify
    runs-on: ubuntu-latest
    # npm trusted publishing: the trusted publisher on npmjs.com names this
    # repository, release.yml, and this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for pkg in @uwacwy/print-server @uwacwy/print-agent; do
            # Skips versions already on npm (the manual first publish, or a rerun).
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION is already published."
              continue
            fi
            npm publish -w "$pkg" --access public --tag "$DIST_TAG"
          done

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: print-server
            dockerfile: packages/server/Dockerfile
            platforms: linux/amd64
          - name: print-agent
            dockerfile: packages/agent/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  github-release:
    needs: [verify, npm, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
