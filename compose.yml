name: uwacwy-print-dev

services:
  print:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: dev
    init: true
    env_file:
      - path: ./packages/server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4200
      SOCKET_DEV_PORT: 4201
      DATA_DIR: /data
      NODE_ENV: development
      SITE_URL: http://localhost:${DEV_HTTP_PORT:-4200}
      TRUST_PROXY: 'false'
    ports:
      - '127.0.0.1:${DEV_HTTP_PORT:-4200}:4200'
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./angular.json:/app/angular.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./tsconfig.test.json:/app/tsconfig.test.json:ro
      - ./proxy.conf.mjs:/app/proxy.conf.mjs:ro
      - ./packages:/app/packages:ro
      # Writable, so the dev command can build shared's declarations under the read-only packages mount.
      - /app/packages/shared/dist
      - print_dev_data:/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4200/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  print_dev_data:
