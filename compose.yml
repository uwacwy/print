name: omega-print-dev

services:
  print:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    init: true
    env_file:
      - path: ./server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      NODE_ENV: development
      PUBLIC_URL: http://localhost:8080
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8080}:8080"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./server/package.json:/app/server/package.json:ro
      - ./shared/package.json:/app/shared/package.json:ro
      - ./agent/package.json:/app/agent/package.json:ro
      - ./server/src:/app/server/src:ro
      - ./shared/src:/app/shared/src:ro
      - print_dev_data:/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  print_dev_data:
